<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cuánto volumen puedo perder si subo precios?</title>
<style>
:root{
  --canvas:#FFFFFF; --lienzo:#E6E6E6; --band:#8A8A8A; --band-ink:#FFFFFF;
  --cream:#FCF3DB; --cream-line:#D9D9D9;
  --ink:#262626; --ink-2:#404040; --muted:#767676;
  --line:#BFBFBF; --line-soft:#D9D9D9; --zebra:#F2F2F2; --hover:#EAF1F8;
  --plot:#FFFFFF; --grid:#A6A6A6; --safe:#E8F1E9; --risk:#FBECEC;
  --neg:#C00000; --pos:#0070C0; --dot:#9DBBD6; --dot-line:#2E75B6; --ok:#3F7D3F;
}
html{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#D6D6D6;color:var(--ink);
  font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding:0;font-size:13px}
.report{max-width:1240px;margin:0 auto;background:var(--lienzo);border:1px solid var(--line)}
.band{background:var(--band);padding:10px 16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.band h1{margin:0;color:var(--band-ink);font-size:18px;font-weight:700;line-height:1.2}
.band .who{margin:3px 0 0;color:#FFCC4D;font-size:13px;font-weight:600;line-height:1.2}
.headline{margin-left:auto;text-align:right;color:var(--band-ink)}
.headline b{display:block;font-size:26px;font-weight:700;line-height:1}
.headline span{display:block;font-size:11.5px;margin-top:3px;max-width:28ch;opacity:.93}
.bar{margin:8px 8px 0;background:var(--band);border:1px solid #6E6E6E;
  padding:7px 11px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.sl>span{display:block;font-size:11px;color:#FFFFFF;font-weight:600;margin-bottom:4px}
.tiles{display:flex;gap:4px;flex-wrap:wrap}
.tile{font-family:inherit;font-size:11.5px;color:var(--ink);background:var(--canvas);
  border:1px solid #A6A6A6;padding:3px 8px;cursor:pointer;line-height:1.2}
.tile:hover{background:var(--hover)}
.tile[aria-pressed="true"]{background:#1C1C1C;border-color:#1C1C1C;color:#FFF;font-weight:600}
.tile:focus-visible,tr.click:focus-visible{outline:2px solid var(--pos);outline-offset:1px}
.tile.alza[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.grid{display:grid;grid-template-columns:296px 1fr;gap:8px;margin:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.viz{background:var(--canvas);border:1px solid var(--line)}
.banner{background:var(--cream);border-bottom:1px solid var(--cream-line);text-align:center;
  font-size:12.5px;font-weight:600;padding:5px 8px;color:var(--ink)}
.pad{padding:7px 10px 4px}
.note{font-size:10px;color:var(--muted);padding:0 10px 6px;margin:0;line-height:1.35}
.kpis{background:var(--canvas);border-bottom:1px solid var(--line-soft);
  display:grid;grid-template-columns:repeat(4,1fr)}
.kpi{padding:7px 11px;border-right:1px solid var(--line-soft)}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.kpi span{font-size:17px;font-weight:700}
.kpi em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{background:var(--cream);border:1px solid var(--line);font-weight:600;padding:4px 6px;text-align:left}
thead th.n{text-align:right}
tbody td{border:1px solid var(--line-soft);padding:3px 6px;color:var(--ink-2);line-height:1.25}
tbody td.n{text-align:right}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr.tot td{font-weight:700;color:var(--ink)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--hover)}
.neg{color:var(--neg);font-weight:600}
.okc{color:var(--ok);font-weight:600}
.sm{font-size:10px;color:var(--muted);display:block}
svg{display:block;width:100%;height:auto}
@media (max-width:880px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.headline{margin-left:0;text-align:left}}

html,body{height:100%;overflow:hidden}
body{display:grid;place-items:center;padding:0}
#stage{width:1280px;height:720px;transform-origin:center center;flex:none}
.report{width:1280px;height:720px;max-width:none;margin:0;display:flex;flex-direction:column;overflow:hidden}
.band{flex:none}
.bar{flex:none}
.grid{flex:1;min-height:0;align-items:stretch}
.stack{min-height:0}
.stack>.viz{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.grid>.viz{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.grid>.viz>.pad{flex:1;min-height:0;display:flex}
.grid>.viz>.pad>svg{width:100%;height:100%}
.banner,.kpis,.note{flex:none}
.stack>.viz>.pad{flex:1;min-height:0;display:flex;flex-direction:column}
.stack>.viz>.pad>svg{width:100%;height:100%;min-height:0}
.stack>.viz>.pad>table{flex:none}
@media (max-width:880px){#stage{transform:none!important}}

.stack>.viz>.pad{overflow:hidden}
tbody td{padding:2px 6px;font-size:12px;line-height:1.2}
thead th{padding:3px 6px;font-size:11.5px}
.sm{font-size:9.5px;line-height:1.15}

/* ===== Celular: el tablero deja de ser un lienzo fijo de 1280x720 y fluye ===== */
@media (max-width:880px){
  html,body{height:auto!important;overflow-x:hidden!important;overflow-y:visible!important}
  body{place-items:normal!important;justify-items:normal!important;align-items:normal!important}
  #stage{width:100%!important;max-width:100vw!important;margin:0!important;position:static!important}
  .report,.band,.band>*,.bar,.sl,.tiles,.grid,.grid>.viz,.stack,.stack>.viz,.pad,.kpis,.kpi{min-width:0!important;max-width:100%}
  .band>div:first-child{flex:1 1 100%}
  .headline{width:auto!important;flex:1 1 100%}
  body{display:block!important;background:var(--lienzo);font-size:14px}
  #stage{width:auto!important;height:auto!important;transform:none!important}
  .report{width:100%!important;height:auto!important;display:block!important;overflow:visible!important;border:0}

  .band{padding:14px 14px 12px;gap:10px}
  .band h1{font-size:16px}
  .headline{margin-left:0;text-align:left;width:100%}
  .headline b{font-size:24px}
  .headline span{max-width:none}

  /* filtros: cada fila se desliza de lado en lugar de apilarse */
  .bar{margin:8px 8px 0;padding:10px 0 8px;display:grid;gap:10px}
  .sl{padding:0 10px;min-width:0}
  .tiles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -10px;padding:0 10px 2px}
  .tiles::-webkit-scrollbar{display:none}
  .tile{flex:none;font-size:13px;padding:8px 12px;min-height:36px}

  .grid{display:flex!important;flex-direction:column;gap:8px;margin:8px}
  .grid>.viz{order:-1}
  .stack,.stack>.viz,.grid>.viz{min-height:0;overflow:visible!important;display:block!important}
  .grid>.viz>.pad,.stack>.viz>.pad{display:block!important;overflow:visible!important}

  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{border-bottom:1px solid var(--line-soft)}
  .kpi:nth-child(2n){border-right:0}
  .kpi span{font-size:18px}
  .kpi b,.kpi em{font-size:12px}

  /* gráfica principal: conserva su tamaño legible y se desliza de lado */
  .grid>.viz>.pad{overflow-x:auto!important;-webkit-overflow-scrolling:touch;padding:8px 10px 6px}
  .grid>.viz>.pad>svg{width:auto!important;min-width:640px;height:auto!important}
  .stack>.viz>.pad>svg{width:100%!important;height:auto!important}
  .scroll-note{display:block;font-size:11.5px;color:var(--muted);padding:6px 10px 0}

  .banner{font-size:13.5px;padding:8px 10px}
  .note{font-size:11.5px;padding:4px 10px 10px}

  /* tablas: legibles y con desplazamiento propio si no caben */
  .stack>.viz>.pad{overflow-x:auto!important}
  table{min-width:100%}
  tbody td{font-size:13px;padding:7px 8px;line-height:1.3}
  thead th{font-size:12px;padding:6px 8px}
  .sm{font-size:11px}
}
@media (min-width:881px){.scroll-note{display:none}}

@media (min-width:881px){#stage{position:absolute;left:50%;top:50%;transform-origin:center center}}
</style>
</head>
<body>
<div id="stage"><main class="report">
  <div class="band">
    <div>
      <h1>Distribuidora de alimentos y abarrotes · retail y mayoreo</h1>
      <p class="who">¿Cuánto volumen puedo perder si subo precios?</p>
    </div>
    <div class="headline" id="hl"></div>
  </div>

  <div class="bar">
    <div class="sl"><span>Si subo el precio</span><div class="tiles" id="fu"></div></div>
    <div class="sl"><span>Canal</span><div class="tiles" id="fc"></div></div>

    <div class="sl"><span>Mes</span><div class="tiles" id="fm"></div></div>

  <div class="grid">
    <div class="stack">
      <div class="viz">
        <div class="banner">Qué tanto aguanta cada línea</div>
        <div class="pad" style="padding-bottom:8px">
          <table><thead><tr><th>Línea</th><th class="n">Margen</th><th class="n">Puede perder</th></tr></thead>
          <tbody id="tLinea"></tbody></table>
        </div>
      </div>
      <div class="viz">
        <div class="banner">Qué tanto aguanta cada canal</div>
        <div class="pad" style="padding-bottom:8px">
          <table><thead><tr><th>Canal</th><th class="n">Margen</th><th class="n">Puede perder</th></tr></thead>
          <tbody id="tCanal"></tbody></table>

      </div>
    </div>

    <div class="viz">
      <div class="banner" id="bn"></div>
      <div class="kpis" id="kpis"></div>
      <p class="scroll-note" aria-hidden="true">Desliza la gráfica hacia la derecha →</p>
      <div class="pad"><svg id="ch" viewBox="0 0 820 470" role="img" aria-label="Volumen que se puede perder según el aumento de precio"></svg></div>
      <p class="note" id="nt"></p>
    </div>
  </div>
</main></div>

}

function tabla(id,mapa,campo){
  const rows=Object.entries(mapa).map(([k,nm])=>{
    const o=agg(campo==="ln"?{ln:k}:{cn:k});
    if(!o.N)return`<tr><td>${nm}</td><td class="n">—</td><td class="n">—</td></tr>`;
    const m=marg(o);
    return`<tr><td>${nm}</td><td class="n">${pc(m,1)}</td><td class="n okc">${pc(tol(m),1)}</td></tr>`;}).join("");
  const t=agg(),mt=marg(t);
  document.getElementById(id).innerHTML=t.N
    ?`<tr class="tot"><td>Total</td><td class="n">${pc(mt,1)}</td><td class="n okc">${pc(tol(mt),1)}</td></tr>`+rows
    :`<tr><td colspan="3" style="color:var(--muted)">Sin datos en esta selección.</td></tr>`;
}

function chart(){
  const el=document.getElementById("ch"),o=agg(),m=marg(o);
  if(!o.N){el.innerHTML=`<text x="410" y="220" text-anchor="middle" font-size="14" fill="#767676">Sin datos con los filtros seleccionados</text>`;return;}
  const W=820,H=470,mT=26,mB=96,mL=62,mR=18,pw=W-mL-mR,ph=H-mT-mB;
  const x1=.16,y1=Math.min(.62,Math.max(.35,tol(m)*1.9));
  const X=v=>mL+v/x1*pw, Y=v=>mT+ph-v/y1*ph;

  let s=`<rect x="${mL}" y="${mT}" width="${pw}" height="${ph}" fill="var(--plot)"/>`;
  // curva de equilibrio
  const pts=[];for(let p=0;p<=x1+1e-9;p+=x1/120)pts.push([p,Math.min(y1,tol(m)*0+p/(m+p))]);
  const dpath=pts.map(([p,v],i)=>(i?"L":"M")+X(p).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  // zonas
  s+=`<path d="${dpath} L${X(x1)} ${mT} L${mL} ${mT} Z" fill="var(--risk)"/>`;
  s+=`<path d="${dpath} L${X(x1)} ${mT+ph} L${mL} ${mT+ph} Z" fill="var(--safe)"/>`;
  // rejilla
  for(let t=0;t<=y1+1e-9;t+=y1>.4?.1:.05){
    s+=`<line x1="${mL}" y1="${Y(t)}" x2="${W-mR}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1" stroke-dasharray="3 4" opacity=".33"/>`;
    s+=`<text x="${mL-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${(t*100).toFixed(0)}%</text>`;}
  for(let p=0;p<=x1+1e-9;p+=.02){
    s+=`<line x1="${X(p)}" y1="${mT}" x2="${X(p)}" y2="${mT+ph}" stroke="var(--grid)" stroke-width="1" stroke-dasharray="3 4" opacity=".33"/>`;
    s+=`<text x="${X(p)}" y="${mT+ph+17}" text-anchor="middle" font-size="11" fill="var(--muted)">${(p*100).toFixed(0)}%</text>`;}
  s+=`<line x1="${mL}" y1="${mT+ph}" x2="${W-mR}" y2="${mT+ph}" stroke="var(--grid)" stroke-width="2"/>`;
  s+=`<line x1="${mL}" y1="${mT}" x2="${mL}" y2="${mT+ph}" stroke="var(--grid)" stroke-width="1.5"/>`;
  s+=`<path d="${dpath}" fill="none" stroke="#404040" stroke-width="2"/>`;

  // etiquetas de zona
  s+=`<text x="${mL+16}" y="${mT+24}" font-size="12.5" font-weight="700" fill="var(--neg)">Si pierdes más volumen que esto, ganas menos que hoy</text>`;
  s+=`<text x="${W-mR-16}" y="${mT+ph-16}" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--ok)">Aquí ganas más que hoy</text>`;

  // punto elegido
  const t=tol(m),cx=X(alza),cy=Y(Math.min(t,y1));
  s+=`<line x1="${cx}" y1="${mT}" x2="${cx}" y2="${mT+ph}" stroke="var(--ok)" stroke-width="1.4" stroke-dasharray="5 4"/>`;
  s+=`<line x1="${mL}" y1="${cy}" x2="${cx}" y2="${cy}" stroke="var(--ok)" stroke-width="1.4" stroke-dasharray="5 4"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="6.5" fill="var(--ok)" stroke="#FFF" stroke-width="1.4"/>`;
  const iz=cx>W*.6,tx=iz?cx-12:cx+12,an=iz?"end":"start";
  s+=`<rect x="${iz?tx-306:tx-4}" y="${cy-52}" width="310" height="42" fill="#FFF" stroke="var(--ok)"/>`;
  s+=`<text x="${iz?tx-298:tx+2}" y="${cy-36}" font-size="12" font-weight="700" fill="var(--ok)">Si subes ${pc(alza,0)} el precio…</text>`;
  s+=`<text x="${iz?tx-298:tx+2}" y="${cy-20}" font-size="12" fill="var(--ink-2)">puedes vender hasta ${pc(t,1)} menos y ganar igual</text>`;

  // ejes
  s+=`<text x="${mL+pw/2}" y="${H-56}" text-anchor="middle" font-size="11.5" fill="var(--muted)">Cuánto subes el precio</text>`;
  s+=`<text x="15" y="${mT+ph/2}" text-anchor="middle" font-size="11.5" fill="var(--muted)" transform="rotate(-90 15 ${mT+ph/2})">Volumen que puedes perder</text>`;
  // leyenda centrada abajo
  const lg=[["l","#404040","Punto de equilibrio"],["b","var(--safe)","Ganas más que hoy"],["b","var(--risk)","Ganas menos que hoy"]];
  const an2=lg.map(([t,,x])=>22+x.length*6+26);
  let lx=mL+(pw-an2.reduce((a,b)=>a+b,0))/2,ly=H-22;
  lg.forEach(([t,c,txt],i)=>{
    s+= t==="l" ? `<line x1="${lx}" y1="${ly-4}" x2="${lx+18}" y2="${ly-4}" stroke="${c}" stroke-width="2.4"/>`
                : `<rect x="${lx}" y="${ly-11}" width="18" height="13" fill="${c}" stroke="var(--line)"/>`;
    s+=`<text x="${lx+22}" y="${ly}" font-size="11.5" fill="var(--ink-2)">${txt}</text>`;lx+=an2[i];});
  el.innerHTML=s;
}

function render(){slicers();kpis();tabla("tLinea",LN,"ln");tabla("tCanal",CN,"cn");chart();}
render();

function ajustar(){const s=Math.min(innerWidth/1280,innerHeight/720);
  document.getElementById("stage").style.transform="translate(-50%,-50%) scale("+s.toFixed(4)+")";}
addEventListener("resize",ajustar);ajustar();
</script>
</body>
</html>
